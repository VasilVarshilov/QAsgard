<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <g filter="url(#shadow)">
    <!-- Outer Shield -->
    <path d="M256 72 L384 128 V248 C384 340 328 410 256 440 C184 410 128 340 128 248 V128 Z" 
          fill="url(#shieldGrad)" stroke="#fbbf24" stroke-width="8" stroke-linejoin="round"/>
    <!-- Inner Checkmark / QA Spear -->
    <path d="M208 248 L240 280 L312 196" 
          fill="none" stroke="#ffffff" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="256" cy="350" r="14" fill="#fbbf24"/>
  </g>
</svg>
